services:
  studio:
    # Built and published by .github/workflows/publish.yml; deploy/update.sh pulls new versions.
    image: ghcr.io/medamine1920/med-amin-portfolio:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:3000"
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      web:
        aliases:
          - medamine-studio
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
networks:
  web:
    external: true
