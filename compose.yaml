services:
  portfolio:
    build: .
    restart: unless-stopped
    init: true
    ports:
      # Private staging only. Access through an SSH tunnel over Tailscale.
      - "127.0.0.1:8080:3000"
    env_file: .env
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
